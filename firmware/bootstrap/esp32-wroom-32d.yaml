esphome:
  name: esp32-wroom-32d
  friendly_name: esp32-wroom-32d
  min_version: 2025.11.0
  name_add_mac_suffix: false


esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"   
  
# Use full flash size and max standard CPU frequency
  flash_size: 4MB
  cpu_frequency: 240MHz

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: "n8KAEVEKePlMSdQoMfCUjVTufCvYZYYPo1SmzOHa960="
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "0199fed747569ed73d2064ea0d88a0d0"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-Wroom-32D Fallback Hotspot"
    password: "mbjNHsaKg85X"

captive_portal:

web_server:
  port: 80
  version: 3
  log: false
