esphome:
  name: esp32-n16r8-gw-1
  friendly_name: esp32-n16r8-gw-1
  min_version: 2025.11.0
  name_add_mac_suffix: false


esp32:
# board: esp32-s3-devkitc-1
  board: esp32-s3-devkitc1-n16r8
# If that board ID is not available, keep:
# board: esp32-s3-devkitc-1  
  variant: esp32s3
  framework:
    type: esp-idf

# Use full flash size and max standard CPU frequency
  flash_size: 16MB
  cpu_frequency: 240MHz

# Enable the built‑in 8 MB PSRAM in octal mode at 80 MHz
psram:
  mode: octal
  speed: 80MHz

# (optional) extra PlatformIO tuning if you run into flash/PSRAM quirks:
#platformio_options:
#  board_build.flash_mode: dio

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: "xa17TRAwg+9fuPTjyT2RIrTvCHpkJbNDi4xTwXM1BGI="
  reboot_timeout: 0s


ota:
  - platform: esphome
    password: "8a8f2a070ca3576c5cf6a30dc58dfe91"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-N16R8-Gw-1"
    password: "t09IBUQTlsJL"

captive_portal:

web_server_base:
  id: web_base

web_server:
  port: 80
  version: 3
  log: false
