# ╔══════════════════════════════════════════════════════════════════╗
# ║  Intervals                                                      ║
# ╚══════════════════════════════════════════════════════════════════╝


interval:
  # Clock display refresh (every 10 seconds)
  - interval: 10s
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            char buf[20];
            snprintf(buf, sizeof(buf), "%02d:%02d:%02d %02d/%02d",
                     now.hour, now.minute, now.second,
                     now.month, now.day_of_month);
            id(current_time).publish_state(buf);
          }

  # One-time About description (5 seconds after boot)
  - interval: 5s
    then:
      - lambda: |-
          static bool published = false;
          if (!published) {
            id(about_description).publish_state(
              "ESP32-C3 BLE gateway — 3x ThermoPro TP357 (Office, First Floor, Outside). "
              "15-min averages, 24h RAM + 45-day flash history. "
              "Embedded dashboard with charts, CSV export/import, and device management.");
            published = true;
          }

