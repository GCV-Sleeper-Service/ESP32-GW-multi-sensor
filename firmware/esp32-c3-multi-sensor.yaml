                id(last_seen_outside).publish_state(seen_buf);
              }
              if (devices[2].batt_last >= 0) id(battery_outside).publish_state(devices[2].batt_str);
  # <<< SENSOR_MANIFEST:THERMOPRO_END >>>

  - platform: wifi_signal
    name: "WiFi Signal"
    icon: "mdi:wifi"
    update_interval: 30s
    web_server:
      sorting_group_id: group_diag
