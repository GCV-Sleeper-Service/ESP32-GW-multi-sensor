# ESP32-C3 Multi-Sensor Gateway - v7.6.10.1
#
# Current package summary
# - ESP32-C3 SuperMini gateway for multiple ThermoPro TP357 BLE sensors
# - 15-minute averages stored in 24h RAM ring buffers
# - Hourly persistence at minute ${persist_minute} into a dedicated history NVS partition
# - Merged /history/* HTTP endpoints for RAM + persisted history
# - Embedded dashboard served from ../dashboard/dashboard.h
# - Dashboard keeps the Phase 1 bindEvents() + App.State structure from 7.3.4.x
# - Export All now serializes retained-history fetches to reduce ESP/proxy request bursts
# - Sensor recolor updates both line color and point-marker color across charts
# - 15-minute chart markers now match the smaller real-time marker size
# - Theme toggle now forces a runtime chart redraw so users do not need Ctrl+F5
# - Keeps storage stats panel fed by GET /api/storage-stats
# - Adds lightweight GET /api/status for version/health checks
# - Dashboard management actions: reboot and delete retained history remain protected by Basic auth
# - Dashboard minification pipeline: html-minifier-terser + terser (~40KB flash savings)
# - v7.5.3.4: raise CONFIG_LWIP_MAX_SOCKETS 13→16 to fix ENFILE crash when dashboard
#             opens SSE + concurrent history/status fetches (httpd_accept_conn error 23)
#
# Required files
# - firmware/esp32-c3-multi-sensor.yaml
# - ../dashboard/dashboard.h
# - ../dashboard/sensor_history_multi.h
# - ../partitions/esp32-c3-multi-partitions.csv
# - ../secrets.yaml

# ─── Hourly persistence schedule ──
substitutions:
  persist_minute: "10"
  mgmt_auth_username: !secret gateway_mgmt_username
  mgmt_auth_password: !secret gateway_mgmt_password

# ─── Core ESPHome configuration ─────────────────────────────────
esphome:
  name: "esp32-c3-multi"
  friendly_name: ESP32-C3 Multi-Sensor GW
  min_version: 2025.11.0
  name_add_mac_suffix: false
  includes:
    - ../dashboard/dashboard.h
    - ../dashboard/sensor_history_multi.h
    - ../src/gateway_manifest.h
    - ../src/aggregator_config.h
  on_boot:
    - # Priority -100: run after web server is fully initialized.
      # Registers custom /history/*, /sensors.json, /dashboard.html,
      # /dashboard-download, /api/storage-stats, and /api/status via AsyncWebHandler.
      # register_history_handler() restores the newest persisted
      # hourly segments into RAM on boot so charts still have a recent
      # baseline after a restart.
      # Dashboard content remains embedded through ../dashboard/dashboard.h.
      priority: -100
      then:
        - lambda: |-
            register_history_handler(id(web_base), "${mgmt_auth_username}", "${mgmt_auth_password}", "v7.6.10.1");
            id(dashboard_link).publish_state(
              "Dashboard: /dashboard or /dashboard.html — Download: /dashboard-download");
    - # Priority 600: run after WiFi and SNTP are available.
      # Starts the PingAdapter RTOS task for icmp_ping devices.
      priority: 600
      then:
        - lambda: |-
            // <<< SENSOR_MANIFEST:PING_BOOT_BEGIN >>>
            #ifdef PING_DEVICE_INDEX
            static PingAdapter ping_adapter;
            ping_adapter.start(PING_DEVICE_INDEX, PING_TARGET);
            #endif
            // <<< SENSOR_MANIFEST:PING_BOOT_END >>>
    - # Priority 600: run after WiFi and SNTP are available.
      # Starts the aggregator polling task (aggregator role only).
      # The task has an internal 10s delay to allow WiFi and local
      # boot to fully settle before the first satellite poll.
      priority: 600
      then:
        - lambda: |-
            #if AGGREGATOR_ENABLED
            start_aggregator_task();
            #endif

# ─── Chip and framework ─────────────────────────────────────────
# ESP-IDF (not Arduino) for better BLE + WiFi coexistence.
# Socket budget (CONFIG_LWIP_MAX_SOCKETS):
#   Base system (~8): WiFi/DHCP + mDNS(2) + SNTP + API listener +
#                     web listener + 1–2 misc
#   Dashboard open (~5): SSE /events + /api/status + /api/storage-stats
#                        + 2× history (Promise.all temp+hum per sensor)
#   Peak total: ~13.  15 keeps measured headroom while recovering lwIP RAM.
#   v7.6.7.3 two-tab validation (SSE + polling, 5 min) passed with zero
#   ENFILE/httpd_accept_conn(23) failures, so 15 is the approved V2-H cap.
#   Cost: ~600 bytes of lwIP RAM per extra socket.
#
# httpd task stack (CONFIG_HTTPD_STACK_SIZE):
#   Default 4096 bytes is insufficient for the aggregator overlay.  The
#   handleRequest() → handle_aggregator_gateways_/live_() call chains build
#   large std::string responses plus authenticate_management_() →
#   extract_basic_auth_() → base64_decode_() with std::string temporaries.
#   8192 bytes provides headroom for the deepest call paths.
#   Cost: ~4KB additional RAM (one-time, for the httpd task stack).
#
# NOTE: the history handler (sensor_history_multi.h) reads up to 1080
# NVS blobs synchronously per /history/* request (PERSIST_SLOTS = 45d×24).
# This blocks the async_tcp task for ~0.5–2 s and causes 300 ms+ component
# warnings when the device has accumulated a full 45 days of history.
# A proper fix requires yielding between NVS reads (deferred task or chunked
# streaming) — tracked as a separate issue.
esp32:
  variant: esp32c3
  flash_size: 4MB
  partitions: ../partitions/esp32-c3-multi-partitions.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "15"

external_components:
  - source:
      type: local
      path: local_components
    components: ['web_server_idf']

logger:
  level: WARN
  logs:
    wifi: ERROR
    api: ERROR

# ─── Debug component ─────────────────────────────────────────────
# Required by the debug sensors/text_sensors below.
debug:
  update_interval: 30s

ota:
  - platform: esphome

# ─── Embedded dashboard approach ─────────────────────────────────
# The dashboard is compiled into ../dashboard/dashboard.h and served by
# the custom history handler through /dashboard, /dashboard.html, and
# /dashboard-download. v7.5.0.1 adds the minification build pipeline:
# dashboard.html is minified via html-minifier-terser + terser before
# generate-header.sh embeds it, saving ~40KB of flash.
# Phase 1 structural enforcement for the dashboard event/state layer, and
# applies a narrow UI hotfix set: serialized merged export, point-marker
# recolor sync, smaller 15-minute markers, and forced chart redraw on
# theme changes.

# ─── Home Assistant API ──────────────────────────────────────────
# reboot_timeout: 0s — CRITICAL: prevents reboot when no HA connected.
api:
  encryption:
    key: "6+Hp4ywnRtYt7IEjB/BpsKbjsI9guOoJeSXJ47ya3/k="
  reboot_timeout: 0s

# ─── WiFi ────────────────────────────────────────────────────────
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.120.189

# ─── Time synchronization ───────────────────────────────────────
# 15-minute averaging remains aligned to :00, :15, :30, :45.
# 15-minute averages remain aligned to :00, :15, :30, :45.
# 24h of averages stay in RAM (96 points per series). The firmware then
# persists one hourly segment to the dedicated history NVS partition at
# minute ${persist_minute}, limiting worst-case power-loss exposure to
# about one hour while retaining about 45 days in flash.
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Los_Angeles"
    on_time:
      - seconds: 0
        minutes: /15
        then:
          - lambda: |-
              // ════════════════════════════════════════════════════════
              // 15-minute averaging lambda
              //
              // For each sensor: compute averages, store in the 24h RAM
              // ring buffer (or explicit gap), format output strings,
              // and publish to template text_sensors.
              // ════════════════════════════════════════════════════════
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return;
              uint32_t epoch = now.timestamp;
              // <<< SENSOR_MANIFEST:AVERAGING_BEGIN >>>
              // ── Office ─────────────────────────────────────
              devices[0].compute_and_format(epoch);
              id(avg_temp_office).publish_state(devices[0].temp_avg_str);
              id(avg_hum_office).publish_state(devices[0].hum_avg_str);
              if (devices[0].batt_last >= 0) id(battery_office).publish_state(devices[0].batt_str);

              // ── First Floor ─────────────────────────────────────
              devices[1].compute_and_format(epoch);
              id(avg_temp_first_floor).publish_state(devices[1].temp_avg_str);
              id(avg_hum_first_floor).publish_state(devices[1].hum_avg_str);
              if (devices[1].batt_last >= 0) id(battery_first_floor).publish_state(devices[1].batt_str);

              // ── Outside ─────────────────────────────────────
              devices[2].compute_and_format(epoch);
              id(avg_temp_outside).publish_state(devices[2].temp_avg_str);
              id(avg_hum_outside).publish_state(devices[2].hum_avg_str);
              if (devices[2].batt_last >= 0) id(battery_outside).publish_state(devices[2].batt_str);

              // ── WAN Latency (network) ──────────────────────────────
              devices[3].compute_averages(epoch);

              // ── NAS Health (system) ──────────────────────────────
              devices[4].compute_averages(epoch);
              // <<< SENSOR_MANIFEST:AVERAGING_END >>>

              // ── Shared clock update ────────────────────────
              char time_buf[20];
              snprintf(time_buf, sizeof(time_buf), "%02d:%02d %02d/%02d",
                       now.hour, now.minute, now.month, now.day_of_month);
              id(current_time).publish_state(time_buf);

      - seconds: 0
        minutes: ${persist_minute}
        then:
          - lambda: |-
              // Hourly history-partition persistence is deliberately offset from the
              // top-of-hour average to avoid running both paths at once.
              // At :10 it stores the previous 1h segment (4 x 15m points).
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return;
              persist_hourly_segment(now.timestamp);



# ─── Web server ──────────────────────────────────────────────────
# Sorting groups control the layout of the built-in ESP web page.
# Dashboard Download is placed between About and sensor groups
# per the user's requested ordering.
web_server_base:
  id: web_base

web_server:
  port: 80
  version: 3
  log: false
  sorting_groups:
    - id: group_about
      name: "About This Gateway"
      sorting_weight: 1
    - id: group_dashboard
      name: "Dashboard Access"
      sorting_weight: 5
    # <<< SENSOR_MANIFEST:SORTING_GROUPS_BEGIN >>>
    - id: group_office
      name: "Office"
      sorting_weight: 10
    - id: group_first_floor
      name: "First Floor"
      sorting_weight: 20
    - id: group_outside
      name: "Outside"
      sorting_weight: 30
    # <<< SENSOR_MANIFEST:SORTING_GROUPS_END >>>

    - id: group_diag
      name: "Diagnostics-Info"
      sorting_weight: 90


# ─── BLE tracker ─────────────────────────────────────────────────
esp32_ble_tracker:


# ╔══════════════════════════════════════════════════════════════════╗
# ║  BLE Sensors — 3× ThermoPro TP357                               ║
# ║                                                                  ║
# ║  Each sensor callback:                                           ║
# ║    1. Feeds value to SensorEntity (add_sample / set_battery)     ║
# ║    2. Updates last_seen_epoch + publishes Last Seen text         ║
# ║    3. Formats and publishes current reading text_sensor           ║
# ╚══════════════════════════════════════════════════════════════════╝

sensor:

  # <<< SENSOR_MANIFEST:THERMOPRO_BEGIN >>>
  # ══════════════════════════════════════════════════════════════════
  # SENSOR 1: OFFICE — MAC DB:06:2C:58:8A:59
  # ══════════════════════════════════════════════════════════════════
  - platform: thermopro_ble
    mac_address: "DB:06:2C:58:8A:59"
    temperature:
      id: raw_temp_office
      name: "Office Temp Raw"
      internal: true
      on_value:
        then:
          - lambda: |-
              devices[0].add_sample(0, x);
              devices[0].mark_seen(::time(nullptr));
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                char seen_buf[20];
                snprintf(seen_buf, sizeof(seen_buf), "%02d:%02d:%02d %02d/%02d", now.hour, now.minute, now.second, now.month, now.day_of_month);
                id(last_seen_office).publish_state(seen_buf);
              }
              if (!isnan(x) && x > -50.0f && x < 80.0f) {
                float f = x * 9.0f / 5.0f + 32.0f;
                char buf[32];
                snprintf(buf, sizeof(buf), "%.1f \xC2\xB0" "C / %.1f \xC2\xB0" "F", x, f);
                id(cur_temp_office).publish_state(buf);
              }
    humidity:
      id: raw_hum_office
      name: "Office Hum Raw"
      internal: true
      on_value:
        then:
          - lambda: |-
              devices[0].add_sample(1, x);
              devices[0].mark_seen(::time(nullptr));
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                char seen_buf[20];
                snprintf(seen_buf, sizeof(seen_buf), "%02d:%02d:%02d %02d/%02d", now.hour, now.minute, now.second, now.month, now.day_of_month);
                id(last_seen_office).publish_state(seen_buf);
              }
              if (!isnan(x) && x >= 0.0f && x <= 100.0f) {
                char buf[16];
                snprintf(buf, sizeof(buf), "%.1f %%", x);
                id(cur_hum_office).publish_state(buf);
              }
    battery_level:
      id: raw_batt_office
      name: "Office Battery Raw"
      internal: true
      on_value:
        then:
          - lambda: |-
              devices[0].set_battery(x);
              devices[0].mark_seen(::time(nullptr));
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                char seen_buf[20];
                snprintf(seen_buf, sizeof(seen_buf), "%02d:%02d:%02d %02d/%02d", now.hour, now.minute, now.second, now.month, now.day_of_month);
                id(last_seen_office).publish_state(seen_buf);
              }
              if (devices[0].batt_last >= 0) id(battery_office).publish_state(devices[0].batt_str);

  # ══════════════════════════════════════════════════════════════════
  # SENSOR 2: FIRST FLOOR — MAC D5:D8:4C:25:06:49
  # ══════════════════════════════════════════════════════════════════
  - platform: thermopro_ble
    mac_address: "D5:D8:4C:25:06:49"
    temperature:
      id: raw_temp_first_floor
      name: "First Floor Temp Raw"
      internal: true
      on_value:
        then:
          - lambda: |-
              devices[1].add_sample(0, x);
              devices[1].mark_seen(::time(nullptr));
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                char seen_buf[20];
                snprintf(seen_buf, sizeof(seen_buf), "%02d:%02d:%02d %02d/%02d", now.hour, now.minute, now.second, now.month, now.day_of_month);
                id(last_seen_first_floor).publish_state(seen_buf);
              }
              if (!isnan(x) && x > -50.0f && x < 80.0f) {
                float f = x * 9.0f / 5.0f + 32.0f;
                char buf[32];
                snprintf(buf, sizeof(buf), "%.1f \xC2\xB0" "C / %.1f \xC2\xB0" "F", x, f);
                id(cur_temp_first_floor).publish_state(buf);
              }
    humidity:
      id: raw_hum_first_floor
      name: "First Floor Hum Raw"
      internal: true
      on_value:
        then:
          - lambda: |-
              devices[1].add_sample(1, x);
              devices[1].mark_seen(::time(nullptr));
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                char seen_buf[20];
                snprintf(seen_buf, sizeof(seen_buf), "%02d:%02d:%02d %02d/%02d", now.hour, now.minute, now.second, now.month, now.day_of_month);
                id(last_seen_first_floor).publish_state(seen_buf);
              }
              if (!isnan(x) && x >= 0.0f && x <= 100.0f) {
                char buf[16];
                snprintf(buf, sizeof(buf), "%.1f %%", x);
                id(cur_hum_first_floor).publish_state(buf);
              }
    battery_level:
      id: raw_batt_first_floor
      name: "First Floor Battery Raw"
      internal: true
      on_value:
        then:
          - lambda: |-
              devices[1].set_battery(x);
              devices[1].mark_seen(::time(nullptr));
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                char seen_buf[20];
                snprintf(seen_buf, sizeof(seen_buf), "%02d:%02d:%02d %02d/%02d", now.hour, now.minute, now.second, now.month, now.day_of_month);
                id(last_seen_first_floor).publish_state(seen_buf);
              }
              if (devices[1].batt_last >= 0) id(battery_first_floor).publish_state(devices[1].batt_str);

  # ══════════════════════════════════════════════════════════════════
  # SENSOR 3: OUTSIDE — MAC DF:EB:DE:19:11:6C
  # ══════════════════════════════════════════════════════════════════
  - platform: thermopro_ble
    mac_address: "DF:EB:DE:19:11:6C"
    temperature:
      id: raw_temp_outside
      name: "Outside Temp Raw"
      internal: true
      on_value:
        then:
          - lambda: |-
              devices[2].add_sample(0, x);
              devices[2].mark_seen(::time(nullptr));
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                char seen_buf[20];
                snprintf(seen_buf, sizeof(seen_buf), "%02d:%02d:%02d %02d/%02d", now.hour, now.minute, now.second, now.month, now.day_of_month);
                id(last_seen_outside).publish_state(seen_buf);
              }
              if (!isnan(x) && x > -50.0f && x < 80.0f) {
                float f = x * 9.0f / 5.0f + 32.0f;
                char buf[32];
                snprintf(buf, sizeof(buf), "%.1f \xC2\xB0" "C / %.1f \xC2\xB0" "F", x, f);
                id(cur_temp_outside).publish_state(buf);
              }
    humidity:
      id: raw_hum_outside
      name: "Outside Hum Raw"
      internal: true
      on_value:
        then:
          - lambda: |-
              devices[2].add_sample(1, x);
              devices[2].mark_seen(::time(nullptr));
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                char seen_buf[20];
                snprintf(seen_buf, sizeof(seen_buf), "%02d:%02d:%02d %02d/%02d", now.hour, now.minute, now.second, now.month, now.day_of_month);
                id(last_seen_outside).publish_state(seen_buf);
