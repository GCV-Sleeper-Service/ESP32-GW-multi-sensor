# ╔══════════════════════════════════════════════════════════════════╗
# ║  Text Sensors — per-sensor current readings + averages           ║
# ║                                                                  ║
# ║  Dashboard routes are backed by ../dashboard/dashboard.h      ║
# ║  Phase 1 UI logic now uses bindEvents() + App.State      ║
# ║  Per-sensor text sensors include current values, averages,       ║
# ║  battery, and last-seen timestamps.                              ║
# ╚══════════════════════════════════════════════════════════════════╝

text_sensor:

  # ── About ──────────────────────────────────────────────────────
  - platform: template
    name: "Description"
    id: about_description
    icon: "mdi:information-outline"
    update_interval: never
    web_server:
      sorting_group_id: group_about
      sorting_weight: 1

  # ── Shared ─────────────────────────────────────────────────────
  - platform: template
    name: "Current Time"
    id: current_time
    icon: "mdi:timeline-clock"
    update_interval: never
    web_server:
      sorting_group_id: group_about
      sorting_weight: 2

  - platform: template
    name: "Flash Size"
    id: flash_size
    lambda: |-
      return std::string("4096 KB");
    update_interval: 60s

  - platform: template
    name: "SRAM Size"
    id: sram_size
    lambda: |-
      return std::string("400 KB");
    update_interval: 60s

  - platform: template
    name: "PSRAM"
    id: psram_status
    lambda: |-
      return std::string("None");
    update_interval: 60s

  # ── Dashboard Access ───────────────────────────────────────────
  # This is plain text because the built-in ESPHome web_server shows
  # text_sensor state as text rather than rendering clickable HTML.
  - platform: template
    name: "Dashboard Paths"
    id: dashboard_link
    icon: "mdi:monitor-dashboard"
    update_interval: never
    web_server:
      sorting_group_id: group_dashboard
      sorting_weight: 1


  # <<< SENSOR_MANIFEST:TEXT_SENSORS_BEGIN >>>
  # ══════════════════════════════════════════════════════════════════
