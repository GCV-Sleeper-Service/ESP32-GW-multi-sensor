name: Browser Tests

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'docs/**']
    paths:
      - 'dashboard/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/preflight.sh'
      - 'scripts/build-dashboard.sh'
      - 'scripts/bundle-dashboard.sh'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/preflight.sh'
      - 'scripts/build-dashboard.sh'
      - 'scripts/bundle-dashboard.sh'

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture_set: [3sensor, 1sensor, 2sensor, 4sensor, mixed, aggregator, system]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate fixture variants
        run: node tests/fixtures/generate-fixtures.js

      - name: Verify dashboard bundle sync
        if: matrix.fixture_set == '3sensor'
        run: bash scripts/bundle-dashboard.sh --check

      - name: Verify dashboard HTML matches build
        if: matrix.fixture_set == '3sensor'
        run: bash scripts/build-dashboard.sh --check

      # Cache Playwright browser binaries between runs.
      # Key includes the Playwright version from package-lock.json — cache
      # invalidates automatically when the dependency is upgraded.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # --with-deps always runs to ensure system libraries are present
      # (apt packages aren't cached). Browser binaries are cached above,
      # so Playwright skips the ~200MB download on cache hit.
      - name: Install Playwright browsers
        run: npx playwright install chromium firefox --with-deps

      - name: Run baseline suite (3sensor — 28 tests)
        if: matrix.fixture_set == '3sensor'
        env:
          CI: true
          FIXTURE_SET: ${{ matrix.fixture_set }}
        run: npx playwright test

      - name: Run mixed-category suite (mixed — Group 18)
        if: matrix.fixture_set == 'mixed'
        env:
          CI: true
          FIXTURE_SET: ${{ matrix.fixture_set }}
        run: npx playwright test tests/browser/dashboard.spec.js --grep "18\. Mixed-Category Rendering"

      - name: Run aggregator suite (aggregator — Group 19)
        if: matrix.fixture_set == 'aggregator'
        env:
          CI: true
          FIXTURE_SET: ${{ matrix.fixture_set }}
        run: npx playwright test tests/browser/dashboard.spec.js --grep "19\. Aggregator Mode"

      - name: Run system suite (system — Group 20)
        if: matrix.fixture_set == 'system'
        env:
          CI: true
          FIXTURE_SET: ${{ matrix.fixture_set }}
        run: npx playwright test tests/browser/dashboard.spec.js --grep "20\. System Devices and Data Ingest"

      - name: Run sensor-count smoke suite (${{ matrix.fixture_set }})
        if: matrix.fixture_set != '3sensor' && matrix.fixture_set != 'mixed' && matrix.fixture_set != 'aggregator' && matrix.fixture_set != 'system'
        env:
          CI: true
          FIXTURE_SET: ${{ matrix.fixture_set }}
        run: npx playwright test tests/browser/sensor-count.spec.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.fixture_set }}-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            tests/playwright-report/
            tests/playwright-results/

      - name: Write test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Browser Tests — $(cat VERSION) — fixture_set=${{ matrix.fixture_set }}"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            echo "| Event | ${GITHUB_EVENT_NAME} |"
            echo "| Fixture set | ${{ matrix.fixture_set }} |"
          } >> "$GITHUB_STEP_SUMMARY"
