name: ESP32 Gateway CI

on:
  workflow_dispatch:

jobs:
  preflight-and-compile:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install esphome
          node --version
          npm --version
          python --version
          esphome version

      - name: Prepare working directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          mkdir -p artifacts/firmware

      - name: Create temporary compile secrets
        shell: bash
        run: |
          set -euo pipefail
          cat > firmware/secrets.yaml <<'EOF'
          wifi_ssid: "CI-DUMMY-SSID"
          wifi_password: "CI-DUMMY-PASSWORD"
          gateway_mgmt_username: "ci-user"
          gateway_mgmt_password: "ci-password"
          EOF

      - name: Run preflight
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/preflight.sh 2>&1 | tee build-logs/preflight.log

      - name: Compile firmware
        shell: bash
        run: |
          set -euo pipefail
          esphome compile firmware/esp32-c3-multi-sensor.yaml 2>&1 | tee build-logs/compile.log

      - name: Stage firmware artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find firmware/.esphome/build -type f \( \
            -name 'firmware.bin' -o \
            -name 'firmware.ota.bin' -o \
            -name 'firmware.factory.bin' \
          \) -exec cp -v {} artifacts/firmware/ \; || true

          echo "Staged firmware files:"
          ls -lah artifacts/firmware || true

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ESP32 Gateway CI summary"
            echo
            echo "- Workflow: preflight + compile"
            printf -- '- Ref: `%s`\n' "$GITHUB_REF_NAME"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            echo

            if [[ -f build-logs/preflight.log ]]; then
              pass_count=$(grep -c ': PASS' build-logs/preflight.log || true)
              skip_count=$(grep -c ': SKIP' build-logs/preflight.log || true)
              echo "### Preflight"
              echo "- PASS checks: ${pass_count}"
              echo "- SKIP checks: ${skip_count}"
              echo
            fi

            if [[ -f build-logs/compile.log ]]; then
              build_time=$(grep -E 'SUCCESS] Took ' build-logs/compile.log | tail -n1 | sed -E 's/.*SUCCESS\] Took ([0-9.]+ seconds).*/\1/' || true)
              ram_line=$(grep -E '^RAM:' build-logs/compile.log | tail -n1 || true)
              flash_line=$(grep -E '^Flash:' build-logs/compile.log | tail -n1 || true)
              build_info=$(grep -E '^INFO Build Info:' build-logs/compile.log | tail -n1 || true)

              echo "### Compile"
              [[ -n "$build_time" ]] && echo "- Duration: ${build_time}"
              [[ -n "$ram_line" ]] && echo "- ${ram_line}"
              [[ -n "$flash_line" ]] && echo "- ${flash_line}"
              [[ -n "$build_info" ]] && echo "- ${build_info}"
              echo
            fi

            firmware_count=$(find artifacts/firmware -maxdepth 1 -type f | wc -l | tr -d ' ')
            echo "### Artifacts"
            echo "- Firmware files staged: ${firmware_count}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-gateway-ci-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build-logs/
            artifacts/firmware/

      - name: Remove temporary secrets
        if: always()
        shell: bash
        run: |
          rm -f firmware/secrets.yaml