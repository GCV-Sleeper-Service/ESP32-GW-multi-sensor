name: ESP32 Gateway CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'dashboard/**'
      - 'config/**'
      - 'scripts/**'
      - 'partitions/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    # Required status checks must run for documentation-only PRs too (PLAN-020).
    # Such a PR takes the fast path that the step "List changed paths" decides (PLAN-028).

jobs:
  preflight-and-compile:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed paths
        id: paths
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # PLAN-028: a pull request whose every changed path is documentation runs preflight only.
          # Any other path, an empty diff, a push and a manual run take the full job.
          docs_only=false
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only --no-renames "origin/${BASE_REF}...${HEAD_SHA}" > "$RUNNER_TEMP/changed-paths.txt"
            if [[ -s "$RUNNER_TEMP/changed-paths.txt" ]]; then
              docs_only=true
              while IFS= read -r p; do
                case "$p" in
                  Docs/*|prompts/*|README.md|CURRENT-STATE.md|AGENTS.md|CLAUDE.md) ;;
                  .github/copilot-instructions.md|.github/instructions/*.instructions.md) ;;
                  *) docs_only=false ;;
                esac
              done < "$RUNNER_TEMP/changed-paths.txt"
            fi
            echo "Changed paths: $(wc -l < "$RUNNER_TEMP/changed-paths.txt")"
          fi
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          if [[ "$docs_only" == "true" ]]; then
            echo "### Fast path: documentation only; ESPHome install and compile skipped (PLAN-028)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Full job: ESPHome install and compile" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.paths.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install esphome==2026.4.1
          npm install -g html-minifier-terser
          echo "node=$(node --version) npm=$(npm --version) python=$(python --version) esphome=$(esphome version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare working directories
        shell: bash
        run: |
          mkdir -p build-logs artifacts/firmware

      - name: Create temporary compile secrets
        shell: bash
        run: |
          cat > firmware/secrets.yaml <<'EOF_SECRETS'
          wifi_ssid: "CI-DUMMY-SSID"
          wifi_password: "CI-DUMMY-PASSWORD"
          gateway_mgmt_username: "ci-user"
          gateway_mgmt_password: "ci-password"
          EOF_SECRETS

      - name: Minify dashboard
        if: steps.paths.outputs.docs_only != 'true'
        shell: bash
        run: |
          bash ./scripts/minify-dashboard.sh 2>&1 | tee build-logs/minify.log
          ORIG=$(awk '/Minified:/{print $2}' build-logs/minify.log | tr -d ',')
          MINI=$(awk '/Minified:/{print $4}' build-logs/minify.log | tr -d ',')
          echo "### Minification" >> "$GITHUB_STEP_SUMMARY"
          echo "| Before | After |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${ORIG} bytes | ${MINI} bytes |" >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate dashboard.h from minified source
        if: steps.paths.outputs.docs_only != 'true'
        shell: bash
        run: |
          bash ./scripts/generate-header.sh 2>&1 | tee build-logs/generate-header.log

      - name: Run preflight
        shell: bash
        run: |
          bash ./scripts/preflight.sh 2>&1 | tee build-logs/preflight.log

      - name: Compile firmware
        if: steps.paths.outputs.docs_only != 'true'
        shell: bash
        run: |
          esphome compile firmware/esp32-c3-multi-sensor.yaml 2>&1 | tee build-logs/compile.log

      - name: Stage firmware artifacts
        if: always()
        shell: bash
        run: |
          find firmware/.esphome/build -type f \( \
            -name 'firmware.bin' -o \
            -name 'firmware.ota.bin' -o \
            -name 'firmware.factory.bin' \
          \) -exec cp -v {} artifacts/firmware/ \; 2>/dev/null || true
          echo "Staged firmware files:"
          ls -lah artifacts/firmware/ 2>/dev/null || echo "(none)"

      - name: Write artifact manifest
        if: always()
        shell: bash
        run: |
          {
            echo "# Artifact manifest"
            echo
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Ref: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "## Files"
            find build-logs artifacts -type f | sort
          } | tee artifacts-manifest.txt

          {
            echo
            echo "## Artifact contents"
            echo '```text'
            find build-logs artifacts -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ESP32 Gateway CI — $(cat VERSION)"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Ref | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            echo "| Event | ${GITHUB_EVENT_NAME} |"

            if [[ -f build-logs/preflight.log ]]; then
              pass=$(grep -c ': PASS' build-logs/preflight.log 2>/dev/null || echo 0)
              fail=$(grep -c ': FAIL' build-logs/preflight.log 2>/dev/null || echo 0)
              echo "| Preflight | ${pass} pass / ${fail} fail |"
            fi

            if [[ -f build-logs/compile.log ]]; then
              duration=$(grep -oP 'SUCCESS\] Took \K[0-9.]+ seconds' build-logs/compile.log 2>/dev/null | tail -1 || true)
              ram=$(grep -E '^RAM:' build-logs/compile.log | tail -1 || true)
              flash=$(grep -E '^Flash:' build-logs/compile.log | tail -1 || true)
              [[ -n "$duration" ]] && echo "| Compile time | ${duration} |"
              [[ -n "$ram" ]] && echo "| RAM | ${ram} |"
              [[ -n "$flash" ]] && echo "| Flash | ${flash} |"
            fi

            fw_count=$(find artifacts/firmware -maxdepth 1 -type f 2>/dev/null | wc -l)
            echo "| Firmware files | ${fw_count} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-gateway-ci-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build-logs/
            artifacts/firmware/
            artifacts-manifest.txt

      - name: Remove temporary secrets
        if: always()
        shell: bash
        run: |
          rm -f firmware/secrets.yaml
