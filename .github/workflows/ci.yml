name: CI - Preflight and Compile

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - 'dashboard/**'
      - 'firmware/**'
      - 'partitions/**'
      - 'scripts/**'
      - 'Docs/**'
      - 'VERSION'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - 'dashboard/**'
      - 'firmware/**'
      - 'partitions/**'
      - 'scripts/**'
      - 'Docs/**'
      - 'VERSION'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome==2026.2.1

      - name: Create temporary compile secrets
        shell: bash
        run: |
          cat > firmware/secrets.yaml <<'EOF'
          wifi_ssid: "ci-placeholder-ssid"
          wifi_password: "ci-placeholder-password"
          gateway_mgmt_username: "ci-admin"
          gateway_mgmt_password: "ci-password"
          EOF

      - name: Prepare log folder
        run: mkdir -p build-logs

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run preflight
        shell: bash
        run: |
          ./scripts/preflight.sh 2>&1 | tee build-logs/preflight.log

      - name: Compile firmware
        shell: bash
        run: |
          esphome compile firmware/esp32-c3-multi-sensor.yaml 2>&1 | tee build-logs/compile.log

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ESP32 Gateway CI summary"
            echo
            echo "- Workflow: preflight + compile"
            printf -- '- Ref: `%s`\n' "$GITHUB_REF_NAME"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            echo

            if [[ -f build-logs/preflight.log ]]; then
              pass_count=$(grep -c ': PASS' build-logs/preflight.log || true)
              skip_count=$(grep -c ': SKIP' build-logs/preflight.log || true)
              echo "### Preflight"
              echo "- PASS checks: ${pass_count}"
              echo "- SKIP checks: ${skip_count}"
              echo
            fi

            if [[ -f build-logs/compile.log ]]; then
              build_time=$(grep -E 'SUCCESS] Took ' build-logs/compile.log | tail -n1 | sed -E 's/.*SUCCESS\] Took ([0-9.]+ seconds).*/\1/' || true)
              ram_line=$(grep -E '^RAM:' build-logs/compile.log | tail -n1 || true)
              flash_line=$(grep -E '^Flash:' build-logs/compile.log | tail -n1 || true)
              build_info=$(grep -E '^INFO Build Info:' build-logs/compile.log | tail -n1 || true)
              echo "### Compile"
              [[ -n "$build_time" ]] && echo "- Duration: ${build_time}"
              [[ -n "$ram_line" ]] && echo "- ${ram_line}"
              [[ -n "$flash_line" ]] && echo "- ${flash_line}"
              [[ -n "$build_info" ]] && echo "- ${build_info}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-gateway-ci-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build-logs/
            firmware/.esphome/build/**/firmware.bin
            firmware/.esphome/build/**/firmware.ota.bin
            firmware/.esphome/build/**/firmware.factory.bin
